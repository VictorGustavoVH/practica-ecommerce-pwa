<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="TechVolt, accesorios tecnológicos para mejorar tu espacio y tu día a día."
    />
    <meta name="theme-color" content="#ffffff" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="preload" as="image" href="/images/producto-1.webp" fetchpriority="high" />
    <title>TechVolt | Tecnología para tu día</title>
  </head>
  <body>
    <header class="site-header">
      <div class="header-container">
        <a class="brand" href="/" aria-label="Ir al inicio de TechVolt">
          <img class="brand-icon" src="/icons/icon-192.png" alt="" width="28" height="28" />
          <span>TechVolt</span>
        </a>

        <nav class="main-nav" id="main-nav" aria-label="Navegación principal">
          <a href="/" data-nav-link>Inicio</a>
          <a href="/catalogo" data-nav-link>Catálogo</a>
        </nav>

        <button
          class="menu-button"
          id="menu-toggle"
          type="button"
          aria-label="Abrir menú"
          aria-controls="main-nav"
          aria-expanded="false"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        </button>

        <button
          class="cart-button"
          id="cart-toggle"
          type="button"
          aria-label="Abrir carrito, 0 productos"
          aria-controls="cart-panel"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 4h2l2.1 9.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.6L20 7H6" />
            <circle cx="9" cy="19" r="1.4" />
            <circle cx="17" cy="19" r="1.4" />
          </svg>
          <span class="cart-label">Carrito</span>
          <span class="cart-count" id="cart-count" aria-hidden="true">0</span>
        </button>
      </div>
    </header>

    <main id="app" tabindex="-1"></main>

    <footer class="site-footer">
      <div class="footer-container">
        <a class="footer-brand" href="/">
          <img class="footer-brand-icon" src="/icons/icon-192.png" alt="" width="22" height="22" />
          <span>TechVolt</span>
        </a>
        <p>Accesorios tecnológicos para todos los días.</p>
        <p>&copy; <span id="current-year"></span> TechVolt</p>
      </div>
    </footer>

    <div class="cart-overlay" id="cart-overlay" aria-hidden="true"></div>
    <aside
      class="cart-panel"
      id="cart-panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="cart-title"
      aria-hidden="true"
      inert
    >
      <div class="cart-panel-header">
        <div>
          <p class="eyebrow">Tu selección</p>
          <h2 id="cart-title">Carrito</h2>
        </div>
        <button class="icon-button" id="cart-close" type="button" aria-label="Cerrar carrito">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m6 6 12 12M18 6 6 18" />
          </svg>
        </button>
      </div>

      <div class="cart-items" id="cart-items"></div>

      <div class="cart-summary" id="cart-summary">
        <div>
          <span>Total</span>
          <strong id="cart-total">$0</strong>
        </div>
        <p>Impuestos incluidos. No se realizará ningún pago real.</p>
      </div>
    </aside>
    <p class="sr-only" id="cart-status" role="status" aria-live="polite"></p>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
